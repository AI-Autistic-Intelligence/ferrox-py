[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ferrox-py"
version = "0.1.0"
description = "Enterprise-grade Python async web framework enforcing the 7-Layer Onion Request Pipeline."
authors = [{ name = "AI-Autistic-Intelligence" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0",
    "pyseto>=1.7.0",
    "argon2-cffi>=23.1.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "structlog>=23.1.0",
    "httpx>=0.24.0",
    "motor>=3.3.0",
    "strawberry-graphql>=0.209.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "prometheus-client>=0.17.0",
    "websockets>=11.0.3"
]

[project.scripts]
ferrox = "ferrox_py.cli.commands:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0"
]
