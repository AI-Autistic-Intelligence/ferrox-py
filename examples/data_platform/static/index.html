<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferrox Data Platform - Live Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --success: #34d399;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 3rem;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7), 0 0 20px var(--accent-glow);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .meta {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .status-dot {
            height: 10px; width: 10px;
            background-color: var(--success);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--success);
        }
        .loader {
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <h1>Ferrox Data Platform</h1>
    <div class="subtitle">Real-time Multi-API Aggregation & Async I/O Demonstration</div>

    <div class="dashboard-grid">
        <!-- Market Data -->
        <div class="card">
            <div class="card-header">
                <span>Financial Markets</span>
                <span class="status-dot"></span>
            </div>
            <div class="value" id="btc-price"><span class="loader">Loading...</span></div>
            <div class="meta" id="btc-meta">Binance API | BTC/USDT</div>
        </div>

        <!-- Environment Data -->
        <div class="card" style="--accent: #a78bfa; --accent-glow: rgba(167, 139, 250, 0.4);">
            <div class="card-header">
                <span>Environment</span>
                <span class="status-dot" style="background-color: #a78bfa; box-shadow: 0 0 10px rgba(167, 139, 250, 0.8);"></span>
            </div>
            <div class="value" id="weather-temp"><span class="loader">Loading...</span></div>
            <div class="meta" id="weather-meta">Open-Meteo API | New York</div>
        </div>

        <!-- DevOps Data -->
        <div class="card" style="--accent: #f472b6; --accent-glow: rgba(244, 114, 182, 0.4);">
            <div class="card-header">
                <span>DevOps Infrastructure</span>
                <span class="status-dot" style="background-color: #f472b6; box-shadow: 0 0 10px rgba(244, 114, 182, 0.8);"></span>
            </div>
            <div class="value" id="github-status" style="font-size: 1.5rem; margin-top: 1rem;"><span class="loader">Checking...</span></div>
            <div class="meta" id="github-meta" style="margin-top: 1.1rem;">GitHub REST API</div>
        </div>
    </div>

    <script>
        async function fetchLiveMetrics() {
            try {
                const response = await fetch('/live/dashboard');
                const data = await response.json();
                
                const metrics = data.metrics;
                
                // Update Markets
                document.getElementById('btc-price').innerText = '$' + metrics.markets.price_usd.toLocaleString(undefined, {minimumFractionDigits: 2});
                
                // Update Environment
                document.getElementById('weather-temp').innerText = metrics.environment.temperature_celsius + '°C';
                document.getElementById('weather-meta').innerText = `Open-Meteo | ${metrics.environment.city} | Wind: ${metrics.environment.windspeed}km/h`;
                
                // Update DevOps
                document.getElementById('github-status').innerText = metrics.dev_ops.status;
                
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        // Fetch immediately, then poll every 3 seconds
        fetchLiveMetrics();
        setInterval(fetchLiveMetrics, 3000);
    </script>
</body>
</html>
